name: Build iOS App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
    - uses: actions/setup-node@v4
    - with:
    - node-version: 22

    - name: Install dependencies
      run: |
        npm ci || npm install
        npx cap sync ios

    - name: Build iOS Workspace
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: ios/App/build/Release-iphoneos/