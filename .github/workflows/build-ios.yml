name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          chmod +x node_modules/.bin/*

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Zip iOS Simulator App
        run: |
            cd ios/App/build/Release-iphonesimulator
            zip -r App.app.zip App.app

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ios-simulator-app
                path: ios/App/build/Release-iphonesimulator/App.app.zip